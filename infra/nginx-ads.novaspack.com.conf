server {
    listen 80;
    server_name ads.novaspack.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://ads.novaspack.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name ads.novaspack.com;
    ssl_certificate /etc/letsencrypt/live/ads.novaspack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ads.novaspack.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
        proxy_read_timeout 90s;
    }
}
